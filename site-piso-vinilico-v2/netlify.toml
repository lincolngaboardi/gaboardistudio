# Deploy no Netlify com "Base directory" = site-piso-vinilico-v2
[build]
  publish = "public"
  functions = "functions"

[functions]
  node_bundler = "esbuild"

# Rotas da API
[[redirects]]
  from = "/api/lead"
  to = "/.netlify/functions/lead"
  status = 200

[[redirects]]
  from = "/api/w/*"
  to = "/.netlify/functions/w"
  status = 200

[[redirects]]
  from = "/api/t/*"
  to = "/.netlify/functions/t"
  status = 200

# Cache longo para estáticos e tipo correto para llms.txt
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
